<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>EduCore — offline</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center;
           background: #0B1120; color: #E2E8F0; font-family: system-ui, sans-serif; }
    .card { text-align: center; padding: 2.5rem; max-width: 420px; }
    .icon { font-size: 3rem; }
    h1 { font-size: 1.25rem; margin: 1rem 0 0.5rem; }
    p { color: #94A3B8; line-height: 1.5; margin: 0 0 1.5rem; }
    button { background: #2563EB; color: #fff; border: 0; border-radius: 8px;
             padding: 0.6rem 1.4rem; font-size: 0.95rem; cursor: pointer; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">📡</div>
    <h1>You're offline</h1>
    <p>EduCore couldn't reach the network. Attendance you marked while offline is queued and will sync automatically when you're back.</p>
    <button onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
