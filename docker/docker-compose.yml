# ──────────────────────────────────────────────
# School ERP — Docker Compose (Infrastructure)
# ──────────────────────────────────────────────

services:
  # ── PostgreSQL ──
  postgres:
    image: postgres:16-alpine
    container_name: school-erp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-school_erp}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── MongoDB ──
  mongodb:
    image: mongo:7
    container_name: school-erp-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: school_erp_logs
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

  # ── Redis ──
  redis:
    image: redis:7-alpine
    container_name: school-erp-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

  # ── MinIO (S3-compatible storage) ──
  minio:
    image: minio/minio:latest
    container_name: school-erp-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"

  # ── Adminer (DB GUI) ──
  adminer:
    image: adminer:latest
    container_name: school-erp-adminer
    restart: unless-stopped
    ports:
      - "8081:8080"
    depends_on:
      - postgres

volumes:
  postgres_data:
  mongodb_data:
  redis_data:
  minio_data:
