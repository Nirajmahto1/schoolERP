# ──────────────────────────────────────────────
# Docker Compose — Dev overrides
# ──────────────────────────────────────────────

services:
  postgres:
    ports:
      - "5432:5432"

  redis:
    ports:
      - "6379:6379"

# MongoDB has no override here: the service itself was removed in Phase 7
# (docs/ops/phase7-decisions.md). If you have an old `mongodb_data` volume,
# `docker volume rm` it — nothing in this repo references it.
