# ──────────────────────────────────────────────
# CI (BUILD_PLAN 0.8)
#
# Scope: backend workspaces (packages + Node services + gateway). The Next.js
# web app, Expo mobile app, and Go/Python services have no reliable headless
# build in CI yet — they join when Phase 3/6/8 land their own checks.
#
# The test suite creates throwaway Postgres schemas on whatever DATABASE_URL
# points at, so a plain postgres service container is all the tests need.
# ──────────────────────────────────────────────

name: CI

on:
  push:
    branches: [master, main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Prisma client is generated into node_modules (gitignored) on every job.
  # The schema lives in packages/database; NPM workspaces hoist the binary.
  PRISMA_SCHEMA: packages/database/prisma/schema.prisma

jobs:
  lint:
    name: Lint & typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prisma generate --schema ${{ env.PRISMA_SCHEMA }}
      - run: npx prisma generate --schema packages/control-plane/prisma/schema.prisma
      - name: Turbo lint (tsc --noEmit per workspace)
        run: npx turbo run lint --filter=./packages/* --filter=./apps/*-service --filter=./apps/api-gateway

  test:
    name: Unit & integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: school_erp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/school_erp_test?schema=public
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prisma generate --schema ${{ env.PRISMA_SCHEMA }}
      - run: npx prisma generate --schema packages/control-plane/prisma/schema.prisma
      # turbo does not reliably forward shell env vars into task processes
      # (verified locally: a probe through `turbo run test` sees no
      # DATABASE_URL even when the shell set it). The test harness reads the
      # monorepo-root .env itself, so mirror the local setup by writing one.
      # The step's own env is applied by GitHub to the shell that runs here.
      - name: Write test environment (.env)
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/school_erp_test?schema=public
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL is not set on the test job"
            exit 1
          fi
          printf 'DATABASE_URL=%s\n' "$DATABASE_URL" > .env
      # turbo's test task dependsOn build, so shared packages compile first.
      - name: Test (vitest, incl. cross-tenant isolation suite)
        run: npx turbo run test --filter=./packages/* --filter=./apps/*-service --filter=./apps/api-gateway

  build:
    name: Build (backend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prisma generate --schema ${{ env.PRISMA_SCHEMA }}
      - run: npx prisma generate --schema packages/control-plane/prisma/schema.prisma
      - name: Turbo build
        run: npx turbo run build --filter=./packages/* --filter=./apps/*-service --filter=./apps/api-gateway

  security:
    name: Secrets & dependency scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # gitleaks-action@v2 has an open bug (gitleaks/gitleaks-action#199): on
      # the first scan it builds the range `root^..HEAD`, and a repo's root
      # commit has no parent, so gitleaks exits 1 without scanning anything.
      # Run the CLI directly instead — `git log` without a range scans the
      # full history and handles the root commit fine.
      - name: gitleaks (secret scanning)
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks detect --redact -v --source . --log-opts="--no-merges --first-parent" --report-format=sarif --report-path=results.sarif
        # Report-only for now: the inherited prototype history may trip
        # low-signal rules, and the first report should be reviewed before
        # this blocks merges. Flip to blocking (drop continue-on-error) once
        # the first scan is clean.
        continue-on-error: true
      - name: Upload gitleaks report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-results.sarif
          path: results.sarif
          if-no-files-found: ignore
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Report-only for now: the inherited prototype still carries old deps.
      # Flip to blocking (drop `|| true`) as part of the Phase 1 dependency
      # cleanup, before any paying tenant connects.
      - name: npm audit (advisory report)
        run: npm audit --omit=dev --audit-level=high || true